name: Validate portfolio
on:
  push:
    branches: ["portfolio_2"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: python scripts/fetch_news.py
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Upload preview files
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-preview
          path: out
